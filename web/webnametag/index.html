<!DOCTYPE html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name=color-scheme content='light dark'><title>Badge Nametag</title><link rel=icon href=data:,>
<link rel=stylesheet href=style.css?v=6></head><body><main>
<header><i id=dot></i><div><h1>Supercon Badge</h1><p>Name &amp; photo &middot; <a href=codes.html style='color:inherit'>QR codes &amp; barcodes</a> &middot; <a href=pass.html style='color:inherit'>Boarding pass</a></p></div></header>
<section id=bsec><h2>Badge</h2><p class='cur e' id=bn>Not connected</p>
<form id=cf class=row style='margin-top:12px'><button id=cb type=button>Connect</button></form>
<p class=hint id=ch style='margin-top:10px'></p></section>
<section data-gate><h2>On the badge</h2><p class=cur id=cur></p>
<p class=sub id=sub aria-live=polite><i class=sp></i><span id=sm></span></p></section>
<section data-gate><h2>Name</h2>
<form id=nf method=POST action=/ class=row><input id=ni type=text name=name maxlength=24 placeholder='Your name'
autocomplete=off enterkeyhint=send aria-label=Name><button id=sn>Set</button></form>
<div class=nr><span class=hint id=cn></span><button type=button id=cl class=t>Clear name</button></div></section>
<section id=ps data-gate><h2>Photo</h2><div class=pk>
<input id=f class=v type=file accept='image/*,.heic,.heif'><label for=f><svg viewBox='0 0 24 24'><rect x='3' y='4' width='18' height='16' rx='2'/><circle cx='9' cy='10' r='1.5'/><path d='M21 16l-5-5-9 9'/></svg>Choose photo</label>
<input id=fc class=v type=file accept='image/*' capture=environment><label for=fc id=lc><svg viewBox='0 0 24 24'><path d='M4 8h3l2-3h6l2 3h3v12H4z'/><circle cx='12' cy='13' r='3.5'/></svg>Take photo</label></div>
<p class='hint dh'>Or drop an image here.</p></section>
<section id=dbs><details><summary class=hint>Debug log</summary>
<pre id=dbg style='font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto;user-select:text;-webkit-user-select:text;margin:10px 0'></pre>
<button type=button id=dbc class=g>Copy log</button></details></section></main>
<div id=sh role=dialog aria-modal=true aria-label='Photo editor'>
<div class=bar><button id=cx type=button class=g>Cancel</button>
<b id=ttl></b>
<button id=ss type=button>Next</button></div>
<div id=pg><i></i></div>
<div id=stg><canvas id=c width=480 height=336></canvas><canvas id=pv width=960 height=672 style='display:none'></canvas>
<div id=ld>Rendering preview...</div></div>
<div class=ctl id=ctl><p class=hint id=hn></p>
<label id=zr><span>Zoom</span><input type=range id=z min=0 max=100 value=0></label>
<div id=cs><div class=seg><button id=bw type=button aria-pressed=false>Black &amp; white</button><button id=br type=button aria-pressed=true>B/W + red</button></div>
<label id=rr><span>Red amount</span><input type=range id=rs min=0 max=100 value=50></label></div></div></div>
<div id=ov><div role=alertdialog aria-modal=true><p id=ovt></p><button id=ovb>OK</button></div></div>
<div id=toast role=status></div>
<script src=ble.js?v=6></script><script src=app.js?v=6></script></body></html>
